name: NucleasePrism CI

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  verify:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        python-version: ["3.11", "3.12"]

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install package and dev dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -e .[dev]

      - name: Bytecode compilation check
        run: python -m compileall -q src

      - name: Lint check with flake8
        run: flake8 src tests examples --max-line-length=120 --extend-ignore=E203

      - name: Static type check with mypy
        run: mypy src

      - name: Run pytest suite
        run: pytest -v

      - name: CLI smoke tests
        run: |
          nuclease-prism --help
          nuclease-prism demo --seed 42
          python -m nuclease_prism.cli repair --sequence ATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGATCGAT --cut-index 22
          python -m nuclease_prism.cli calibrate --n-samples 40 --seed 7

      - name: Run standalone examples
        run: |
          python examples/01_tp53_spcas9_design.py
          python examples/02_base_prime_editing_comparison.py
          python examples/03_dsb_repair_hdr_kinetics.py
          python examples/04_pooled_screen_rra_calibration.py
